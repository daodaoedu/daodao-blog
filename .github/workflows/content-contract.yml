name: Blog content contract
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: content
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: daodaoedu/daodao-f2e
          ref: 0e7b4bf8b481d99d8c625f19ddf75e78ba9766ec
          path: frontend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - run: pnpm --dir frontend install --frozen-lockfile --filter "@daodao/blog-content..."
      - run: pnpm --dir frontend --filter @daodao/config generate:env
      - run: pnpm --dir frontend --filter @daodao/blog-content validate --root "$GITHUB_WORKSPACE/content" --mode draft
        env:
          BLOG_CONTENT_DIR: ${{ github.workspace }}/content
  trigger-website:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch website-only release on protected frontend channel
        env:
          GH_TOKEN: ${{ secrets.BLOG_FRONTEND_DISPATCH_TOKEN }}
          CONTENT_SHA: ${{ github.sha }}
          FRONTEND_REF: ${{ vars.BLOG_FRONTEND_REF }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo 'Missing scoped frontend workflow-dispatch token; no release triggered'; exit 1; fi
          case "$FRONTEND_REF" in dev|prod) ;; *) echo 'Missing protected frontend channel ref (dev/prod only)'; exit 1;; esac
          gh workflow run blog-release.yml --repo daodaoedu/daodao-f2e --ref "$FRONTEND_REF" -f operation=publish -f "content_sha=$CONTENT_SHA"
